name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Generated TypeScript types are in sync
        run: |
          pnpm types:generate
          # status catches modified AND untracked (newly exported) bindings
          if [ -n "$(git status --porcelain src/types/generated)" ]; then
            git status --porcelain src/types/generated
            echo "::error::Generated types out of sync — run pnpm types:generate and commit"
            exit 1
          fi

      - name: Lint and format check
        run: pnpm lint

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Production frontend build
        run: pnpm build

      - name: Frontend tests
        run: pnpm test
