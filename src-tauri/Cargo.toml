[package]
name = "retirement"
description = "Local, privacy-first retirement projection app"
authors = ["Enrique Lozano"]
version.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "retirement_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
engine = { path = "../crates/engine" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = "0.10"
time = "0.3"

# PDF export drives WKWebView's native print pipeline directly (see pdf.rs) —
# there is no cross-platform Tauri/wry API for it. Versions pinned to match
# what wry itself already resolves to, so this adds no new versions to the
# dependency graph, only additional features on crates already present.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
tokio = { version = "1", features = ["time"] }
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSData",
    "NSError",
    "NSValue",
    "NSURL",
    "NSDictionary",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSView",
    "NSWindow",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-app-kit",
    "WKWebView",
    "WKPDFConfiguration",
] }
