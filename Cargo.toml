[workspace]
resolver = "2"
members = ["crates/engine", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["serde-compat"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1"
